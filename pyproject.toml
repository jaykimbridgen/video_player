[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video_player"
version = "0.1.0"
description = "헤드리스 Ubuntu 미니 PC에서 동영상 파일을 HDMI로 재생하는 단발 실행형 플레이어"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "jaykimbridgen" }]
dependencies = [
    "python-mpv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest",
]

[project.scripts]
player = "video_player.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------------
# 정적 검사 도구 설정 (계층 0)
# ----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
# 실행 대상은 리눅스(헤드리스 Ubuntu). termios/tty 등 POSIX 모듈이 해소되도록 고정.
platform = "linux"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# python-mpv 는 타입 스텁을 제공하지 않으므로 해당 import 만 무시한다.
[[tool.mypy.overrides]]
module = ["mpv"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# 테스트 설정 (계층 1·2)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 실제 mpv/libmpv 가 필요한 통합 테스트 (계층 2)",
]
# 기본 실행은 단위 테스트만 빠르게 — 통합은 명시적으로 '-m integration' 으로 실행.
addopts = "-m 'not integration'"
