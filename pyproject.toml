[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video_player"
version = "0.1.0"
description = "헤드리스 Ubuntu 미니 PC에서 동영상 파일을 HDMI로 재생하는 단발 실행형 플레이어"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "jaykimbridgen" }]
dependencies = [
    "python-mpv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest",
]

[project.scripts]
player = "video_player.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------------
# 정적 검사 도구 설정 (계층 0)
# ----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# 한국어 docstring·중복 금지 정책과 충돌하는 규칙 제외:
#   D400/D401/D403 = 영어 산문(마침표·명령형·첫 단어 대문자) 가정 — 우리는 파라미터 이름으로 문장 시작.
#   D105/D107 = 매직 메서드·__init__ docstring 강제 — 클래스 docstring 의 `상태:` 섹션이 이미 설명(중복 방지).
ignore = ["D400", "D401", "D403", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# docstring 정책은 라이브러리 공개 표면(src) 대상 — 계층 0·1 이 __all__ 로 검증한다.
# 테스트 함수·가짜 객체 메서드는 이름이 곧 설명이라 docstring 강제는 노이즈("좋은 이름은 주석을 줄인다").
# 스크립트는 모듈 docstring 으로 충분하고 main() 의 D103 만 면제한다.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D103"]

[tool.mypy]
python_version = "3.10"
# 실행 대상은 리눅스(헤드리스 Ubuntu). termios/tty 등 POSIX 모듈이 해소되도록 고정.
platform = "linux"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# python-mpv 는 타입 스텁을 제공하지 않으므로 해당 import 만 무시한다.
[[tool.mypy.overrides]]
module = ["mpv"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# 테스트 설정 (계층 1·2)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 실제 mpv/libmpv 가 필요한 통합 테스트 (계층 2)",
]
# 기본 실행은 단위 테스트만 빠르게 — 통합은 명시적으로 '-m integration' 으로 실행.
addopts = "-m 'not integration'"
